name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finguardian
          POSTGRES_PASSWORD: finguardian_test_password
          POSTGRES_DB: finguardian_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://finguardian:finguardian_test_password@localhost:5432/finguardian_db
      LANGGRAPH_DB_URL: postgresql://finguardian:finguardian_test_password@localhost:5432/finguardian_db
      JWT_SECRET: ci-test-secret-not-for-production
      ALPHA_VANTAGE_API_KEY: dummy-key-unused-in-tests
      RESEND_API_KEY: dummy-key-unused-in-tests
      ALERT_RECIPIENT_EMAIL: test@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
