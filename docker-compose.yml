services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finguardian-postgres
    restart: always
    environment:
      POSTGRES_USER: finguardian
      POSTGRES_PASSWORD: finguardian_dev_password
      POSTGRES_DB: finguardian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nginx:
    image: nginx:alpine
    container_name: finguardian-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  redis:
    image: redis:7-alpine
    container_name: finguardian-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
